<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>lovely-shelf v2 — 结果</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            surface: { 900:'#0d0d14', 800:'#13131e', 700:'#1a1a2e', 600:'#22223f' },
            violet: { 400:'#a78bfa', 500:'#8b5cf6', 600:'#7c3aed' },
            slate: { text:'#e2e8f0', muted:'#94a3b8', faint:'#475569' }
          }
        }
      }
    }
  </script>
  <style>
    * { box-sizing: border-box; }
    body { background: #0d0d14; color: #e2e8f0; font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif; min-height: 100vh; }

    .card { background: #13131e; border: 1px solid rgba(255,255,255,.07); border-radius: 20px; overflow: hidden; }
    .card-warn { border-color: rgba(251,191,36,.2); }

    .field-label { font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #475569; margin-bottom: 4px; }
    .field-input {
      width: 100%;
      background: rgba(255,255,255,.05);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 8px;
      padding: 7px 10px;
      font-size: 13px;
      color: #e2e8f0;
      outline: none;
      transition: border-color .15s, box-shadow .15s;
    }
    .field-input:focus {
      border-color: rgba(139,92,246,.5);
      box-shadow: 0 0 0 3px rgba(139,92,246,.12);
      background: rgba(139,92,246,.06);
    }

    .tag {
      display: inline-flex; align-items: center; gap: 4px;
      background: rgba(139,92,246,.15); color: #a78bfa;
      border: 1px solid rgba(139,92,246,.25);
      border-radius: 999px; padding: 3px 10px; font-size: 11px; font-weight: 500; cursor: pointer;
      transition: background .15s;
    }
    .tag:hover { background: rgba(139,92,246,.25); }

    .btn-primary {
      background: linear-gradient(135deg, #7c3aed, #6d28d9);
      box-shadow: 0 4px 20px rgba(124,58,237,.4);
      transition: all .2s;
    }
    .btn-primary:hover { box-shadow: 0 6px 28px rgba(124,58,237,.55); transform: translateY(-1px); }

    @keyframes slideIn { from{opacity:0;transform:translateY(14px)} to{opacity:1;transform:translateY(0)} }
    .slide-in { animation: slideIn .3s cubic-bezier(.34,1.56,.64,1) both; }
  </style>
</head>
<body>

  <!-- Header -->
  <header style="background:rgba(13,13,20,.85);backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,.06);" class="px-4 py-4 flex items-center gap-3 sticky top-0 z-20">
    <button style="background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);" class="w-8 h-8 rounded-full flex items-center justify-center text-slate-muted hover:text-slate-text transition-colors">
      <i class="fa-solid fa-arrow-left text-sm"></i>
    </button>
    <div class="flex-1">
      <span class="font-semibold text-slate-text">识别结果</span>
    </div>
    <div style="background:rgba(139,92,246,.15);border:1px solid rgba(139,92,246,.25);" class="text-xs text-violet-400 px-2.5 py-1 rounded-full font-medium">3 本书</div>
  </header>

  <main class="max-w-xl mx-auto px-4 py-5 space-y-4 pb-32">

    <!-- Summary -->
    <div style="background:rgba(16,185,129,.06);border:1px solid rgba(16,185,129,.15);" class="flex items-center gap-2.5 rounded-xl px-4 py-3">
      <i class="fa-solid fa-circle-check text-emerald-400 text-sm"></i>
      <span class="text-sm text-slate-text">2 本识别成功</span>
      <span class="text-slate-faint">·</span>
      <i class="fa-solid fa-triangle-exclamation text-amber-400 text-sm"></i>
      <span class="text-sm text-slate-text">1 本请确认</span>
    </div>

    <!-- Card 1: Success -->
    <div class="card slide-in" style="animation-delay:.05s">
      <div class="flex items-center justify-between px-4 pt-4 pb-3" style="border-bottom:1px solid rgba(255,255,255,.05);">
        <div style="background:rgba(16,185,129,.12);border:1px solid rgba(16,185,129,.2);" class="flex items-center gap-1.5 text-emerald-400 text-xs font-semibold px-2.5 py-1 rounded-full">
          <i class="fa-solid fa-circle-check text-xs"></i> 识别成功
        </div>
        <button class="text-xs text-slate-faint hover:text-red-400 transition-colors">
          <i class="fa-solid fa-trash-can mr-1"></i>移除
        </button>
      </div>

      <div class="flex gap-4 p-4">
        <div class="flex-shrink-0">
          <img src="https://images.unsplash.com/photo-1544947950-fa07a98d237f?w=120&h=160&fit=crop"
            class="w-[88px] h-[120px] rounded-xl object-cover" style="box-shadow:0 8px 24px rgba(0,0,0,.5);" />
        </div>

        <div class="flex-1 space-y-2.5 min-w-0">
          <div>
            <div class="field-label">书名</div>
            <input class="field-input font-semibold" value="Being You" />
          </div>
          <div>
            <div class="field-label">副标题</div>
            <input class="field-input" value="A New Science of Consciousness" />
          </div>
          <div class="grid grid-cols-2 gap-2">
            <div>
              <div class="field-label">作者</div>
              <input class="field-input" value="Anil Seth" />
            </div>
            <div>
              <div class="field-label">国家</div>
              <input class="field-input" value="英国" />
            </div>
          </div>
          <div>
            <div class="field-label">类型</div>
            <div class="flex flex-wrap gap-1.5 mt-1">
              <span class="tag">科普 <i class="fa-solid fa-xmark text-xs opacity-50"></i></span>
              <span class="tag">心理相关 <i class="fa-solid fa-xmark text-xs opacity-50"></i></span>
              <button style="background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);" class="tag text-slate-faint hover:text-slate-text">
                <i class="fa-solid fa-plus text-xs"></i>
              </button>
            </div>
          </div>
          <div>
            <div class="field-label">描述</div>
            <textarea class="field-input resize-none text-xs leading-relaxed" rows="2">探索意识的本质，提出关于自我感知的全新科学理论。</textarea>
          </div>
        </div>
      </div>
    </div>

    <!-- Card 2: Warning -->
    <div class="card card-warn slide-in" style="animation-delay:.12s">
      <div class="flex items-center justify-between px-4 pt-4 pb-3" style="border-bottom:1px solid rgba(251,191,36,.1);">
        <div style="background:rgba(251,191,36,.1);border:1px solid rgba(251,191,36,.2);" class="flex items-center gap-1.5 text-amber-400 text-xs font-semibold px-2.5 py-1 rounded-full">
          <i class="fa-solid fa-triangle-exclamation text-xs"></i> 请确认信息
        </div>
        <button class="text-xs text-violet-400 hover:text-violet-300 transition-colors font-medium">
          <i class="fa-solid fa-rotate-right mr-1"></i>重新识别
        </button>
      </div>

      <div class="flex gap-4 p-4">
        <div class="flex-shrink-0">
          <img src="https://images.unsplash.com/photo-1512820790803-83ca734da794?w=120&h=160&fit=crop"
            class="w-[88px] h-[120px] rounded-xl object-cover" style="box-shadow:0 8px 24px rgba(0,0,0,.5);" />
        </div>

        <div class="flex-1 space-y-2.5 min-w-0">
          <div>
            <div class="field-label">书名</div>
            <input class="field-input font-semibold" style="border-color:rgba(251,191,36,.3);" value="Educated" />
          </div>
          <div>
            <div class="field-label">副标题</div>
            <input class="field-input" style="border-color:rgba(251,191,36,.2);" placeholder="未识别到副标题…" />
          </div>
          <div class="grid grid-cols-2 gap-2">
            <div>
              <div class="field-label">作者</div>
              <input class="field-input" value="Tara Westover" />
            </div>
            <div>
              <div class="field-label">国家</div>
              <input class="field-input" value="美国" />
            </div>
          </div>
          <div>
            <div class="field-label">类型</div>
            <div class="flex flex-wrap gap-1.5 mt-1">
              <span class="tag">回忆录 <i class="fa-solid fa-xmark text-xs opacity-50"></i></span>
              <span class="tag">励志 <i class="fa-solid fa-xmark text-xs opacity-50"></i></span>
              <button style="background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);" class="tag text-slate-faint">
                <i class="fa-solid fa-plus text-xs"></i>
              </button>
            </div>
          </div>
          <div>
            <div class="field-label">描述</div>
            <textarea class="field-input resize-none text-xs leading-relaxed" rows="2">一个从未上过学的女孩，靠自学考入剑桥大学的真实故事。</textarea>
          </div>
        </div>
      </div>
    </div>

    <!-- Card 3 -->
    <div class="card slide-in" style="animation-delay:.2s">
      <div class="flex items-center justify-between px-4 pt-4 pb-3" style="border-bottom:1px solid rgba(255,255,255,.05);">
        <div style="background:rgba(16,185,129,.12);border:1px solid rgba(16,185,129,.2);" class="flex items-center gap-1.5 text-emerald-400 text-xs font-semibold px-2.5 py-1 rounded-full">
          <i class="fa-solid fa-circle-check text-xs"></i> 识别成功
        </div>
        <button class="text-xs text-slate-faint hover:text-red-400 transition-colors">
          <i class="fa-solid fa-trash-can mr-1"></i>移除
        </button>
      </div>

      <div class="flex gap-4 p-4">
        <div class="flex-shrink-0">
          <img src="https://images.unsplash.com/photo-1495640388908-05fa85288e61?w=120&h=160&fit=crop"
            class="w-[88px] h-[120px] rounded-xl object-cover" style="box-shadow:0 8px 24px rgba(0,0,0,.5);" />
        </div>

        <div class="flex-1 space-y-2.5 min-w-0">
          <div>
            <div class="field-label">书名</div>
            <input class="field-input font-semibold" value="Atomic Habits" />
          </div>
          <div>
            <div class="field-label">副标题</div>
            <input class="field-input" value="An Easy & Proven Way to Build Good Habits" />
          </div>
          <div class="grid grid-cols-2 gap-2">
            <div>
              <div class="field-label">作者</div>
              <input class="field-input" value="James Clear" />
            </div>
            <div>
              <div class="field-label">国家</div>
              <input class="field-input" value="美国" />
            </div>
          </div>
          <div>
            <div class="field-label">类型</div>
            <div class="flex flex-wrap gap-1.5 mt-1">
              <span class="tag">励志 <i class="fa-solid fa-xmark text-xs opacity-50"></i></span>
              <span class="tag">身心健康 <i class="fa-solid fa-xmark text-xs opacity-50"></i></span>
              <button style="background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);" class="tag text-slate-faint">
                <i class="fa-solid fa-plus text-xs"></i>
              </button>
            </div>
          </div>
          <div>
            <div class="field-label">描述</div>
            <textarea class="field-input resize-none text-xs leading-relaxed" rows="2">用细微的习惯改变，实现人生的复利效应。</textarea>
          </div>
        </div>
      </div>
    </div>

  </main>

  <!-- Bottom bar -->
  <div style="background:rgba(13,13,20,.9);backdrop-filter:blur(20px);border-top:1px solid rgba(139,92,246,.15);" class="fixed bottom-0 inset-x-0 px-4 py-4 z-30">
    <div class="max-w-xl mx-auto">
      <button class="btn-primary w-full text-white font-semibold py-4 rounded-2xl flex items-center justify-center gap-2 text-base mb-2">
        <i class="fa-solid fa-arrow-up-from-bracket"></i>
        确认入库（3 本）
      </button>
      <p class="text-center text-xs text-slate-faint">入库后可在 Notion 书库中查看</p>
    </div>
  </div>

</body>
</html>
