<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>lovely-shelf v2 — 原型总览</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #08080f; font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif; min-height: 100vh; }

    .topbar {
      background: rgba(13,13,20,.95);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(139,92,246,.15);
      padding: 16px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky; top: 0; z-index: 50;
    }
    .logo { display:flex;align-items:center;gap:10px; }
    .logo-icon {
      width: 32px; height: 32px;
      background: linear-gradient(135deg,#7c3aed,#4f46e5);
      box-shadow: 0 0 16px rgba(124,58,237,.5);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
    }
    .logo-text { font-size:17px;font-weight:700;color:#e2e8f0;letter-spacing:-.02em; }
    .logo-text span { color:#a78bfa; }
    .badge { font-size:12px;color:#8b5cf6;background:rgba(139,92,246,.15);border:1px solid rgba(139,92,246,.25);padding:3px 10px;border-radius:999px;font-weight:500; }

    .phone-shell {
      width: 390px;
      background: linear-gradient(160deg, #2a2a3e, #1a1a28);
      border-radius: 52px;
      padding: 14px;
      box-shadow: 0 40px 100px rgba(0,0,0,.7), 0 0 0 1px rgba(139,92,246,.12) inset, 0 0 60px rgba(139,92,246,.06) inset;
    }
    .phone-screen {
      width: 100%; height: 700px;
      border-radius: 40px;
      overflow: hidden;
      position: relative;
      background: #0d0d14;
    }
    .phone-notch {
      position: absolute; top:0; left:50%;
      transform: translateX(-50%);
      width: 120px; height: 34px;
      background: #1a1a28;
      border-radius: 0 0 22px 22px;
      z-index: 10;
    }
    .phone-screen iframe { width:100%;height:100%;border:none;display:block; }

    .status-bar {
      display: flex; justify-content: space-between; align-items: center;
      padding: 0 8px 10px;
      color: rgba(255,255,255,.7);
      font-size: 11px; font-weight: 600;
    }
    .page-label { font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#475569;text-align:center;margin-top:18px; }
    .page-desc { font-size:13px;color:#64748b;text-align:center;margin-top:5px; }

    /* VS badge */
    .vs {
      width: 48px; height: 48px;
      background: rgba(139,92,246,.15);
      border: 1px solid rgba(139,92,246,.25);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      color: #a78bfa; font-weight: 800; font-size: 14px;
      align-self: center;
      flex-shrink: 0;
    }

    /* Color tokens */
    .swatch { width:28px;height:28px;border-radius:7px;flex-shrink:0; }
    .token-section { margin-bottom:20px; }
    .token-title { font-size:11px;color:#475569;font-weight:600;letter-spacing:.05em;text-transform:uppercase;margin-bottom:8px; }
  </style>
</head>
<body>

  <!-- Top bar -->
  <div class="topbar">
    <div class="logo">
      <div class="logo-icon">
        <i class="fa-solid fa-book-open" style="color:white;font-size:14px;"></i>
      </div>
      <span class="logo-text">lovely<span>-shelf</span></span>
      <span class="badge">UI 原型 · v2 深色版</span>
    </div>
    <div style="font-size:13px;color:#475569;">
      <i class="fa-solid fa-moon mr-1.5" style="color:#8b5cf6;"></i>Dark Mode · Indigo
    </div>
  </div>

  <!-- Phones -->
  <div style="display:flex;gap:40px;justify-content:center;align-items:flex-start;padding:52px 32px;flex-wrap:wrap;">

    <div>
      <div class="phone-shell">
        <div class="status-bar">
          <span>9:41</span>
          <div style="display:flex;gap:5px;align-items:center;">
            <i class="fa-solid fa-signal" style="font-size:12px;"></i>
            <i class="fa-solid fa-wifi" style="font-size:12px;"></i>
            <i class="fa-solid fa-battery-full" style="font-size:12px;"></i>
          </div>
        </div>
        <div class="phone-screen">
          <div class="phone-notch"></div>
          <iframe src="home.html" title="上传页" style="padding-top:34px;"></iframe>
        </div>
        <div style="margin-top:12px;display:flex;justify-content:center;">
          <div style="width:120px;height:5px;background:rgba(139,92,246,.3);border-radius:999px;"></div>
        </div>
      </div>
      <div class="page-label">Page 1 · 上传页</div>
      <div class="page-desc">选图 · 缩略图预览 · 开始识别</div>
    </div>

    <div>
      <div class="phone-shell">
        <div class="status-bar">
          <span>9:41</span>
          <div style="display:flex;gap:5px;align-items:center;">
            <i class="fa-solid fa-signal" style="font-size:12px;"></i>
            <i class="fa-solid fa-wifi" style="font-size:12px;"></i>
            <i class="fa-solid fa-battery-full" style="font-size:12px;"></i>
          </div>
        </div>
        <div class="phone-screen">
          <div class="phone-notch"></div>
          <iframe src="result.html" title="结果页" style="padding-top:34px;"></iframe>
        </div>
        <div style="margin-top:12px;display:flex;justify-content:center;">
          <div style="width:120px;height:5px;background:rgba(139,92,246,.3);border-radius:999px;"></div>
        </div>
      </div>
      <div class="page-label">Page 2 · 结果页</div>
      <div class="page-desc">识别结果 · 可编辑 · 确认入库</div>
    </div>

  </div>

  <!-- Design tokens -->
  <div style="max-width:900px;margin:0 auto 52px;padding:0 32px;">
    <div style="background:#13131e;border:1px solid rgba(139,92,246,.15);border-radius:18px;padding:24px;">
      <p style="font-size:12px;font-weight:700;color:#475569;letter-spacing:.08em;text-transform:uppercase;margin-bottom:20px;">v2 设计规范 — Dark Mode + Indigo</p>
      <div style="display:flex;gap:40px;flex-wrap:wrap;">
        <div class="token-section">
          <div class="token-title">Surface 层级</div>
          <div style="display:flex;gap:6px;">
            <div class="swatch" style="background:#08080f;border:1px solid rgba(255,255,255,.1);" title="#08080f"></div>
            <div class="swatch" style="background:#0d0d14;" title="#0d0d14"></div>
            <div class="swatch" style="background:#13131e;" title="#13131e"></div>
            <div class="swatch" style="background:#1a1a2e;" title="#1a1a2e"></div>
            <div class="swatch" style="background:#22223f;" title="#22223f"></div>
          </div>
        </div>
        <div class="token-section">
          <div class="token-title">Violet 主色</div>
          <div style="display:flex;gap:6px;">
            <div class="swatch" style="background:rgba(139,92,246,.15);border:1px solid rgba(139,92,246,.2);" title="glow"></div>
            <div class="swatch" style="background:#a78bfa;" title="#a78bfa"></div>
            <div class="swatch" style="background:#8b5cf6;" title="#8b5cf6"></div>
            <div class="swatch" style="background:#7c3aed;" title="#7c3aed"></div>
            <div class="swatch" style="background:#6d28d9;" title="#6d28d9"></div>
          </div>
        </div>
        <div class="token-section">
          <div class="token-title">文字色</div>
          <div style="display:flex;gap:6px;">
            <div class="swatch" style="background:#e2e8f0;" title="text"></div>
            <div class="swatch" style="background:#94a3b8;" title="muted"></div>
            <div class="swatch" style="background:#475569;" title="faint"></div>
          </div>
        </div>
        <div class="token-section">
          <div class="token-title">状态色</div>
          <div style="display:flex;gap:6px;">
            <div class="swatch" style="background:#10b981;" title="success"></div>
            <div class="swatch" style="background:#fbbf24;" title="warning"></div>
            <div class="swatch" style="background:#f87171;" title="error"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
