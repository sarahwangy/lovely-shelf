<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>lovely-shelf — 识别结果</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            shelf: { 50:'#fdf8f0', 100:'#faefd9', 200:'#f5d9a8', 300:'#efc070', 400:'#e8a040', 500:'#d97706', 600:'#b45309', 700:'#92400e' },
            ink: { DEFAULT:'#1c1917', muted:'#78716c', light:'#a8a29e' }
          },
          fontFamily: { sans: ['-apple-system','BlinkMacSystemFont','PingFang SC','Helvetica Neue','sans-serif'] }
        }
      }
    }
  </script>
  <style>
    .tag { display:inline-flex; align-items:center; gap:4px; background:#faefd9; color:#b45309; border-radius:999px; padding:3px 10px; font-size:12px; font-weight:500; cursor:pointer; transition:background .15s; }
    .tag:hover { background:#f5d9a8; }
    .tag .remove { opacity:.5; font-size:10px; }
    .tag .remove:hover { opacity:1; }
    .field-label { font-size:11px; font-weight:600; color:#a8a29e; text-transform:uppercase; letter-spacing:.05em; margin-bottom:4px; }
    .field-input { width:100%; border:1px solid #e7e5e4; border-radius:8px; padding:8px 10px; font-size:14px; color:#1c1917; background:#fafaf8; transition:border-color .15s, box-shadow .15s; outline:none; }
    .field-input:focus { border-color:#d97706; box-shadow:0 0 0 3px rgba(217,119,6,.12); }
    .card-enter { animation: cardIn .35s cubic-bezier(.34,1.56,.64,1) both; }
    @keyframes cardIn { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:translateY(0)} }
    .success-badge { background:linear-gradient(135deg,#d1fae5,#a7f3d0); color:#065f46; }
    .error-badge { background:linear-gradient(135deg,#fee2e2,#fecaca); color:#991b1b; }
  </style>
</head>
<body class="bg-shelf-50 min-h-screen font-sans">

  <!-- Header -->
  <header class="bg-white border-b border-stone-100 px-4 py-4 flex items-center gap-3 sticky top-0 z-20 shadow-sm">
    <button class="w-8 h-8 rounded-full hover:bg-stone-100 flex items-center justify-center transition-colors text-ink-muted">
      <i class="fa-solid fa-arrow-left text-sm"></i>
    </button>
    <div class="flex items-center gap-2 flex-1">
      <div class="w-7 h-7 bg-shelf-500 rounded-lg flex items-center justify-center">
        <i class="fa-solid fa-book-open text-white text-xs"></i>
      </div>
      <span class="font-semibold text-ink">识别结果</span>
    </div>
    <span class="text-xs text-ink-muted bg-stone-100 px-2.5 py-1 rounded-full">3 本书</span>
  </header>

  <main class="max-w-2xl mx-auto px-4 py-6 space-y-4 pb-32">

    <!-- Summary bar -->
    <div class="flex items-center gap-2 text-sm text-ink-muted">
      <i class="fa-solid fa-circle-check text-green-500 text-xs"></i>
      <span>2 本识别成功</span>
      <span class="text-stone-300">·</span>
      <i class="fa-solid fa-circle-exclamation text-amber-500 text-xs"></i>
      <span>1 本需确认</span>
    </div>

    <!-- ── Card 1: Success ── -->
    <div class="card-enter bg-white rounded-2xl shadow-sm border border-stone-100 overflow-hidden" style="animation-delay:.05s">
      <!-- Card header -->
      <div class="flex items-center justify-between px-4 pt-4 pb-2">
        <span class="success-badge text-xs font-semibold px-2.5 py-1 rounded-full flex items-center gap-1">
          <i class="fa-solid fa-circle-check text-xs"></i> 识别成功
        </span>
        <button class="text-xs text-ink-muted hover:text-red-400 transition-colors">
          <i class="fa-solid fa-trash-can mr-1"></i>移除
        </button>
      </div>

      <div class="flex gap-4 px-4 pb-4">
        <!-- Cover -->
        <div class="flex-shrink-0">
          <img src="https://images.unsplash.com/photo-1544947950-fa07a98d237f?w=120&h=160&fit=crop"
            class="w-24 h-32 rounded-xl object-cover shadow-md" />
        </div>

        <!-- Fields -->
        <div class="flex-1 space-y-3 min-w-0">
          <div>
            <div class="field-label">书名</div>
            <input class="field-input font-medium" value="Being You" />
          </div>
          <div>
            <div class="field-label">副标题</div>
            <input class="field-input" value="A New Science of Consciousness" />
          </div>
          <div class="grid grid-cols-2 gap-2">
            <div>
              <div class="field-label">作者</div>
              <input class="field-input" value="Anil Seth" />
            </div>
            <div>
              <div class="field-label">国家</div>
              <input class="field-input" value="英国" />
            </div>
          </div>
          <div>
            <div class="field-label">类型</div>
            <div class="flex flex-wrap gap-1.5 mt-1">
              <span class="tag">科普 <span class="remove"><i class="fa-solid fa-xmark"></i></span></span>
              <span class="tag">心理相关 <span class="remove"><i class="fa-solid fa-xmark"></i></span></span>
              <span class="tag">非虚构 <span class="remove"><i class="fa-solid fa-xmark"></i></span></span>
              <button class="tag bg-stone-100 text-ink-muted hover:bg-stone-200">
                <i class="fa-solid fa-plus text-xs"></i> 添加
              </button>
            </div>
          </div>
          <div>
            <div class="field-label">一句话描述</div>
            <textarea class="field-input resize-none text-xs leading-relaxed" rows="2">神经科学家探索意识的本质，提出关于自我感知的全新科学理论。</textarea>
          </div>
        </div>
      </div>
    </div>

    <!-- ── Card 2: Needs Review ── -->
    <div class="card-enter bg-white rounded-2xl shadow-sm border border-amber-200 overflow-hidden" style="animation-delay:.12s">
      <div class="flex items-center justify-between px-4 pt-4 pb-2">
        <span class="bg-amber-50 text-amber-700 text-xs font-semibold px-2.5 py-1 rounded-full flex items-center gap-1 border border-amber-200">
          <i class="fa-solid fa-triangle-exclamation text-xs"></i> 请确认信息
        </span>
        <button class="text-xs text-shelf-600 hover:text-shelf-700 transition-colors font-medium">
          <i class="fa-solid fa-rotate-right mr-1"></i>重新识别
        </button>
      </div>

      <div class="flex gap-4 px-4 pb-4">
        <div class="flex-shrink-0">
          <img src="https://images.unsplash.com/photo-1512820790803-83ca734da794?w=120&h=160&fit=crop"
            class="w-24 h-32 rounded-xl object-cover shadow-md" />
        </div>

        <div class="flex-1 space-y-3 min-w-0">
          <div>
            <div class="field-label">书名</div>
            <input class="field-input font-medium border-amber-300" value="Educated" />
          </div>
          <div>
            <div class="field-label">副标题</div>
            <input class="field-input border-amber-300 text-ink-muted italic" placeholder="未识别到副标题" />
          </div>
          <div class="grid grid-cols-2 gap-2">
            <div>
              <div class="field-label">作者</div>
              <input class="field-input" value="Tara Westover" />
            </div>
            <div>
              <div class="field-label">国家</div>
              <input class="field-input" value="美国" />
            </div>
          </div>
          <div>
            <div class="field-label">类型</div>
            <div class="flex flex-wrap gap-1.5 mt-1">
              <span class="tag">回忆录 <span class="remove"><i class="fa-solid fa-xmark"></i></span></span>
              <span class="tag">励志 <span class="remove"><i class="fa-solid fa-xmark"></i></span></span>
              <button class="tag bg-stone-100 text-ink-muted">
                <i class="fa-solid fa-plus text-xs"></i> 添加
              </button>
            </div>
          </div>
          <div>
            <div class="field-label">一句话描述</div>
            <textarea class="field-input resize-none text-xs leading-relaxed" rows="2">一个从未上过学的女孩，靠自学考入剑桥大学的真实成长故事。</textarea>
          </div>
        </div>
      </div>
    </div>

    <!-- ── Card 3: Success ── -->
    <div class="card-enter bg-white rounded-2xl shadow-sm border border-stone-100 overflow-hidden" style="animation-delay:.2s">
      <div class="flex items-center justify-between px-4 pt-4 pb-2">
        <span class="success-badge text-xs font-semibold px-2.5 py-1 rounded-full flex items-center gap-1">
          <i class="fa-solid fa-circle-check text-xs"></i> 识别成功
        </span>
        <button class="text-xs text-ink-muted hover:text-red-400 transition-colors">
          <i class="fa-solid fa-trash-can mr-1"></i>移除
        </button>
      </div>

      <div class="flex gap-4 px-4 pb-4">
        <div class="flex-shrink-0">
          <img src="https://images.unsplash.com/photo-1495640388908-05fa85288e61?w=120&h=160&fit=crop"
            class="w-24 h-32 rounded-xl object-cover shadow-md" />
        </div>

        <div class="flex-1 space-y-3 min-w-0">
          <div>
            <div class="field-label">书名</div>
            <input class="field-input font-medium" value="Atomic Habits" />
          </div>
          <div>
            <div class="field-label">副标题</div>
            <input class="field-input" value="An Easy & Proven Way to Build Good Habits" />
          </div>
          <div class="grid grid-cols-2 gap-2">
            <div>
              <div class="field-label">作者</div>
              <input class="field-input" value="James Clear" />
            </div>
            <div>
              <div class="field-label">国家</div>
              <input class="field-input" value="美国" />
            </div>
          </div>
          <div>
            <div class="field-label">类型</div>
            <div class="flex flex-wrap gap-1.5 mt-1">
              <span class="tag">励志 <span class="remove"><i class="fa-solid fa-xmark"></i></span></span>
              <span class="tag">身心健康 <span class="remove"><i class="fa-solid fa-xmark"></i></span></span>
              <button class="tag bg-stone-100 text-ink-muted">
                <i class="fa-solid fa-plus text-xs"></i> 添加
              </button>
            </div>
          </div>
          <div>
            <div class="field-label">一句话描述</div>
            <textarea class="field-input resize-none text-xs leading-relaxed" rows="2">用细微的习惯改变，实现人生的复利效应。</textarea>
          </div>
        </div>
      </div>
    </div>

  </main>

  <!-- Fixed bottom action bar -->
  <div class="fixed bottom-0 inset-x-0 bg-white/90 backdrop-blur-md border-t border-stone-100 px-4 py-4 z-30">
    <div class="max-w-2xl mx-auto">
      <button class="w-full bg-shelf-500 hover:bg-shelf-600 text-white font-semibold py-4 rounded-2xl transition-colors shadow-lg flex items-center justify-center gap-2 text-base mb-2">
        <i class="fa-solid fa-arrow-up-from-bracket"></i>
        确认入库（3 本）
      </button>
      <p class="text-center text-xs text-ink-light">入库后可在 Notion 书库中查看</p>
    </div>
  </div>

</body>
</html>
